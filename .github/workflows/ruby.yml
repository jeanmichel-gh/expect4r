name: Ruby
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ruby: '4.0.6'
          - os: macos-latest
            ruby: '4.0.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
      - run: bundle exec ruby examples/local_dialogue.rb
      - run: bundle exec ruby examples/local_router.rb
      - run: bundle exec rake package
